<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e2c56"/>
      <stop offset="60%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#040817"/>
    </radialGradient>
    <linearGradient id="brainGradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3c6"/>
      <stop offset="50%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#c9184a"/>
    </linearGradient>
    <linearGradient id="boltGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566"/>
      <stop offset="50%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="zapYellowIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="d1GradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="d2GradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5964"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#iconBg)" stroke="#38bdf8" stroke-width="8"/>

  <!-- Electric Bolts -->
  <polygon points="140,50 165,105 145,108 175,155 125,102 145,98" fill="url(#boltGradIcon)" filter="url(#iconShadow)"/>
  <polygon points="370,50 345,105 365,108 335,155 385,102 365,98" fill="url(#boltGradIcon)" filter="url(#iconShadow)"/>
  <polygon points="400,200 480,205 420,250 460,255 380,335 405,265 365,260" fill="url(#boltGradIcon)" filter="url(#iconShadow)"/>

  <!-- The Smiling Pink Brain Character -->
  <g id="icon-brain" filter="url(#iconShadow)">
    <!-- Thumbs Up Hand -->
    <g transform="translate(130, 85) scale(0.85)">
      <path d="M 12,70 L 40,68 L 36,88 L 8,88 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="5"/>
      <path d="M 18,36 C 18,36 12,48 12,58 C 12,68 22,70 34,70 C 46,70 54,64 54,50 C 54,42 48,36 40,36 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
      <path d="M 22,38 C 20,25 18,6 28,2 C 38,-2 42,12 40,30 L 40,38 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    </g>

    <!-- Brain Outline -->
    <path d="M 210,180 
             C 175,180 165,150 175,130 
             C 160,120 165,95 180,85 
             C 175,65 198,46 220,55 
             C 238,40 270,40 285,54 
             C 305,42 335,52 342,72 
             C 360,78 375,100 365,122 
             C 378,140 370,168 345,180 
             Z" 
          fill="url(#brainGradIcon)" 
          stroke="#1e293b" 
          stroke-width="7"/>

    <!-- Left Eye -->
    <g transform="translate(225, 115)">
      <ellipse cx="0" cy="0" rx="12" ry="15" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
      <ellipse cx="2" cy="0" rx="7" ry="10" fill="#0f172a"/>
      <circle cx="-1" cy="-3" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Winking) -->
    <path d="M 285,118 C 292,108 306,108 314,118" fill="none" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 245,142 C 245,158 280,158 280,142 Z" fill="#7f1d1d" stroke="#1e293b" stroke-width="4"/>
    <path d="M 255,148 C 255,144 270,144 270,148 C 270,155 255,155 255,148 Z" fill="#ff758f"/>
  </g>

  <!-- Clear KIDDO Letters (K I D D O) in 3D -->
  <g transform="translate(42, 210) scale(0.72)" filter="url(#iconShadow)">
    <!-- White backing -->
    <g stroke="#ffffff" stroke-width="26" stroke-linejoin="round" fill="#ffffff">
      <path d="M 80,215 L 80,345 L 126,345 L 126,295 L 160,345 L 210,345 L 155,278 L 205,215 L 155,215 L 126,258 L 126,215 Z"/>
      <rect x="218" y="215" width="40" height="130" rx="20"/>
      <path d="M 270,215 L 320,215 C 362,215 378,245 378,280 C 378,315 362,345 320,345 L 270,345 Z"/>
      <path d="M 388,215 L 438,215 C 480,215 496,245 496,280 C 496,315 480,345 438,345 L 388,345 Z"/>
      <ellipse cx="530" cy="280" rx="42" ry="65"/>
    </g>

    <!-- Front Faces -->
    <!-- K -->
    <path d="M 80,215 L 80,345 L 126,345 L 126,295 L 160,345 L 210,345 L 155,278 L 205,215 L 155,215 L 126,258 L 126,215 Z" fill="#ffe600" stroke="#1e293b" stroke-width="7"/>
    <!-- I -->
    <rect x="218" y="215" width="40" height="130" rx="20" fill="#38bdf8" stroke="#1e293b" stroke-width="7"/>
    <!-- D1 -->
    <path d="M 270,215 L 320,215 C 362,215 378,245 378,280 C 378,315 362,345 320,345 L 270,345 Z" fill="url(#d1GradIcon)" stroke="#1e293b" stroke-width="7"/>
    <path d="M 302,246 L 318,246 C 338,246 348,260 348,280 C 348,300 338,314 318,314 L 302,314 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    <!-- D2 -->
    <path d="M 388,215 L 438,215 C 480,215 496,245 496,280 C 496,315 480,345 438,345 L 388,345 Z" fill="url(#d2GradIcon)" stroke="#1e293b" stroke-width="7"/>
    <path d="M 420,246 L 436,246 C 456,246 466,260 466,280 C 466,300 456,314 436,314 L 420,314 Z" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    <!-- O -->
    <ellipse cx="530" cy="280" rx="42" ry="65" fill="#38bdf8" stroke="#1e293b" stroke-width="7"/>
    <ellipse cx="530" cy="280" rx="18" ry="34" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
  </g>

  <!-- Big ZAP letters -->
  <g transform="translate(68, 350) scale(0.72)" filter="url(#iconShadow)">
    <g stroke="#ffffff" stroke-width="26" stroke-linejoin="round" fill="#ffffff">
      <polygon points="140,360 270,360 270,405 195,475 275,475 265,520 130,520 130,475 205,405 140,405"/>
      <polygon points="265,520 315,360 380,360 425,520 375,520 360,470 325,470 310,520"/>
      <path d="M 390,360 L 485,360 C 530,360 545,395 535,435 C 525,470 495,485 455,485 L 430,485 L 420,520 L 375,520 Z"/>
    </g>
    <polygon points="140,360 270,360 270,405 195,475 275,475 265,520 130,520 130,475 205,405 140,405" fill="url(#zapYellowIcon)" stroke="#1e293b" stroke-width="8"/>
    <polygon points="265,520 315,360 380,360 425,520 375,520 360,470 325,470 310,520" fill="#f72585" stroke="#1e293b" stroke-width="8"/>
    <polygon points="334,435 352,435 343,398" fill="#1e293b"/>
    <path d="M 390,360 L 485,360 C 530,360 545,395 535,435 C 525,470 495,485 455,485 L 430,485 L 420,520 L 375,520 Z" fill="#9d4edd" stroke="#1e293b" stroke-width="8"/>
  </g>
</svg>
